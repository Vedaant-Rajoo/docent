name: Main source branch

on:
  pull_request:
    branches: [main]
    # edited catches a PR retargeted to main.
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  source:
    name: Source branch
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Allow dev, hotfix/* and fix/* from this repository
        env:
          HEAD: ${{ github.head_ref }}
          FROM_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$FROM_FORK" = true ]; then
            echo "::error::PRs into main must come from this repository, not a fork."
            exit 1
          fi
          case "$HEAD" in
            dev|hotfix/*|fix/*) echo "$HEAD may merge into main." ;;
            *) echo "::error::Only dev, hotfix/* and fix/* may merge into main, not $HEAD."; exit 1 ;;
          esac
