<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docent · Settings</title>
  <style>
    :root { color-scheme: dark; font: 13px/1.5 system-ui, sans-serif; background: #111113; color: #ededee; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 624px; margin: 0 auto; padding: 64px 24px 40px; }
    header { margin-bottom: 32px; }
    .brand { margin: 0 0 10px; color: #9c9ca2; font-size: 12px; }
    h1 { margin: 0; font-size: 22px; line-height: 1.3; font-weight: 600; letter-spacing: -.025em; }
    fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 20px 0; border-bottom: 1px solid #29292d; }
    .label { display: block; font-weight: 500; }
    .detail { display: block; margin-top: 4px; color: #939398; font-size: 12px; font-weight: 400; }
    legend { width: 100%; padding: 28px 0 0; color: #c5c5c9; font-weight: 500; }
    input[type=checkbox] { appearance: none; position: relative; flex: none; margin: 0; width: 32px; height: 20px; border: 1px solid #47474c; border-radius: 99px; background: #343438; cursor: pointer; }
    input[type=checkbox]::after { content: ''; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: #b3b3b8; }
    input[type=checkbox]:checked { border-color: #e4e4e7; background: #e4e4e7; }
    input[type=checkbox]:checked::after { left: 15px; background: #202023; }
    input:focus-visible { outline: 2px solid #b9b9bf; outline-offset: 4px; }
    fieldset:disabled { opacity: .45; }
    :disabled { cursor: default; }
    footer { display: flex; justify-content: space-between; gap: 24px; padding-top: 16px; color: #939398; font-size: 12px; }
    footer p { margin: 0; }
    #status { min-height: 18px; }
    #status[data-error] { color: #ffa4a4; }
    @media (max-width: 480px) { main { padding: 32px 20px; } .row, footer { gap: 16px; } }
  </style>
</head>
<body>
  <main>
    <header><p class="brand">Docent</p><h1>Settings</h1></header>
    <fieldset id="controls" disabled>
      <label class="row">
        <span><span class="label">Enable Docent</span><span class="detail">Use the Docent layout on YouTube.</span></span>
        <input id="enabled" type="checkbox" role="switch">
      </label>
      <fieldset id="preferences">
        <legend>Video page</legend>
        <label class="row">
          <span><span class="label">Auto-scroll transcript</span><span class="detail">Follow the current line during playback.</span></span>
          <input id="autoScroll" type="checkbox" role="switch">
        </label>
        <label class="row">
          <span><span class="label">Show Dislike</span><span class="detail">Keep YouTube’s Dislike button next to Like.</span></span>
          <input id="showDislike" type="checkbox" role="switch">
        </label>
      </fieldset>
    </fieldset>
    <footer>
      <p>Requires YouTube’s dark theme.</p>
      <p id="status" role="status">Loading settings…</p>
    </footer>
  </main>
  <script src="settings.js"></script>
</body>
</html>
